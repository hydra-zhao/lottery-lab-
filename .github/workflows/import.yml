name: Import initial Lottery Lab sources
on:
  push:
    paths:
      - 'bootstrap/source.tar.xz'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify bundle and extract tested sources
        run: |
          echo 'e2c7bc8c91c21e7fb466fe648ee1e7972f6102a2d8dfd7d015b5f63e167bcffa  bootstrap/source.tar.xz' | sha256sum -c -
          tar -xJf bootstrap/source.tar.xz
          python -m unittest discover -s tests -v
      - name: Publish extracted source files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat: publish tested SSQ and DLT research CLI v0.1.0'
          git push
