name: Update historical draw data
on:
  schedule:
    # 15:05 UTC = 23:05 Beijing; mirror availability may lag the official draw.
    - cron: '5 15 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and merge both historical datasets
        run: python -m lottery_lab sync --game all
      - name: Commit draw changes only
        run: |
          git add data/ssq.json data/dlt.json
          if git diff --cached --quiet; then
            echo 'No draw changes'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: refresh validated SSQ/DLT draw history'
          git push
